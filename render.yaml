databases:
  - name: portfolio-cms-db
    plan: free
    databaseName: portfolio_cms
    user: portfolio_cms

services:
  - type: web
    name: portfolio-cms-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-cms-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.4"

  - type: web
    name: portfolio-cms-admin
    runtime: static
    rootDir: cms-admin
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://portfolio-cms-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
